<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Comercial · Acesso Restrito</title>
<style>:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.gate{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(8px);border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.lock-icon{width:48px;height:48px;background:rgba(255,255,255,0.08);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;font-size:22px}
.gate h1{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-0.02em}
.gate p{margin:0 0 24px;color:#94a3b8;font-size:13.5px;line-height:1.5}
form{display:flex;flex-direction:column;gap:12px}
input[type="password"]{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#fff;padding:12px 14px;font-size:15px;border-radius:10px;outline:none;font-family:inherit;transition:border-color .15s,background .15s}
input[type="password"]:focus{border-color:#16a34a;background:rgba(255,255,255,0.08)}
input[type="password"]::placeholder{color:#64748b}
button{background:#16a34a;color:#fff;border:none;padding:12px 16px;font-size:15px;font-weight:600;border-radius:10px;cursor:pointer;font-family:inherit;transition:background .15s}
button:hover{background:#15803d}button:disabled{opacity:.6;cursor:wait}
.error{background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);color:#fca5a5;padding:10px 12px;border-radius:8px;font-size:13px;display:none;margin-top:4px}
.error.show{display:block}.footer{margin-top:24px;color:#475569;font-size:11px;text-align:center}
</style></head><body>
<div class="gate"><div class="lock-icon">🔒</div><h1>Análise Comercial</h1><p>Diagnóstico das abordagens de venda do comercial. Conteúdo protegido.</p>
<form id="pass-form"><input type="password" id="pass" placeholder="Senha" autofocus required autocomplete="current-password">
<button type="submit" id="btn">Entrar</button><div class="error" id="error">Senha incorreta. Tente novamente.</div>
</form><div class="footer">Prosperum · uso interno</div></div>
